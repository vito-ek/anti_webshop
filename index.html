<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>aware – Produkter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <section class="hero">
      <picture class="hero-billede">
        <!-- Billede til mobil -->
        <source srcset="img/hero_mobil.webp" media="(max-width: 600px)" />

        <!-- Billede til desktop -->
        <img src="img/hero.webp" alt="Hero billede" />
      </picture>

      <header>
        <h1>AWARE</h1>
        <button class="burger">☰</button>

        <nav class="menu">
          <a href="index.html">Home</a>
          <a href="index.html">Products</a>
          <a href="review.html">Review product</a>
          <a href="about.html">About</a>
        </nav>
      </header>

      <div class="hero-indhold">
        <h2>A community sharing honest reviews, to help you make better choices.</h2>
        <a class="explore" href="#h1_forside">Explore products</a>
      </div>
    </section>
    <main>
      <section class="h1_forside">
        <h1 id="h1_forside">Produkter</h1>
      </section>

      <p class="filter">Filter by category</p>

      <nav id="filter">
        <button>All</button>
        <button>Beauty</button>
        <button>Fragrances</button>
        <span id="visantal">antal</span> fundet
      </nav>

      <p class="filter">Sort by</p>

      <nav id="sortering">
        <button>Rating high-low</button>
        <button>Rating low-high</button>
      </nav>

      <section id="produktliste" class="produktliste"></section>
    </main>

    <script src="index.js"></script>
  </body>
